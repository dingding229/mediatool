name: Verify and publish AMD64 to Docker Hub
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mediatool-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    # Native workers + full serial race/migrations + kernel + browser + cache save must finish.
    # This is CI wall-clock headroom, not a production/test/RPC budget change.
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: media_tool
          POSTGRES_DB: media_tool_test
          POSTGRES_PASSWORD: ci-postgres-fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U media_tool -d media_tool_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      GOTOOLCHAIN: local
      TEST_DB_EXEC_MODE: psql
      MEDIA_TOOL_REQUIRE_FFMPEG: "1"
      MEDIA_TOOL_TEST_PLUGIN_UID: "65532"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: {fetch-depth: 0}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with: {go-version: '1.26.9', cache: true}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json}
      - name: Resolve Git build metadata
        id: meta
        run: go run ./cmd/media-tool-dev build-meta github >> "$GITHUB_OUTPUT"
      - name: Create isolated test configuration (no production secrets)
        run: |
          go run ./cmd/media-tool-dev ci-config
      - name: Pinned plugin initialization and resource inventory gate
        run: |
          go run ./cmd/media-tool-dev plugins check
          go run ./cmd/media-tool-dev plugins assets --check
          go run ./cmd/media-tool-dev plugins assets
          go run ./cmd/media-tool-dev plugins matrix --check
      - run: npm ci --prefix web --no-fund --no-audit
      - name: Install pinned browser for DOM sanitization and E2E tests
        run: npx --prefix web playwright install --with-deps --only-shell chromium
      - name: Prepare pinned offline IP data for real query tests
        run: sh scripts/prepare-ip2region.sh data/build/ip2region
      - run: npm test --prefix web
      - run: npm run build --prefix web
      - name: Restore pinned media-tool dependency bundle
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: /tmp/mediatool-ci-media-tools-f8a
          key: media-tools-${{ runner.os }}-${{ runner.arch }}-e458207bb03f-${{ hashFiles('scripts/prepare-ci-media-tools.sh') }}
      - name: Install real media test tools
        run: |
          started=$SECONDS
          if ! bash scripts/prepare-ci-media-tools.sh; then
            # Real fallback, not a removed test/dependency or relaxed assertion.
            sudo apt-get update
            sudo apt-get install -y ffmpeg --no-install-recommends
            ffmpeg -version
            ffprobe -version
            echo 'Media bundle unavailable; apt fallback used.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Media tools preparation: $((SECONDS-started))s" >> "$GITHUB_STEP_SUMMARY"
      - name: Build same-commit static test app once
        run: |
          dir="$RUNNER_TEMP/mediatool-test-app"
          mkdir -p "$dir"
          eval "$(go run ./cmd/media-tool-dev build-meta env)"
          CGO_ENABLED=0 go build -trimpath -ldflags="$MEDIA_TOOL_LDFLAGS" -o "$dir/media-tool" ./cmd/media-tool
          go build -trimpath -o "$dir/media-tool-dev" ./cmd/media-tool-dev
          printf '%s\n' "$GITHUB_SHA" > "$dir/media-tool.sha"
          echo "MEDIA_TOOL_STATIC_TEST_BINARY=$dir/media-tool" >> "$GITHUB_ENV"
          echo "MEDIA_TOOL_DEV_BIN=$dir/media-tool-dev" >> "$GITHUB_ENV"
      - name: Serial full race and real static AMD64 worker gate
        # Includes the former focused plugins/v2,httpapi,acquisition,messaging
        # step under the identical non-root/static-worker environment, once.
        run: |
          echo "Runner real-UID thread count: $(ps -u "$(id -u)" -L --no-headers | wc -l)"
          bash scripts/test-go.sh
        env:
          TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
      - name: Complete updater entrypoint in isolated Docker (real inspect, dump, replace, health and audit)
        env:
          TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          MEDIA_TOOL_TEST_HELPER_DOCKER: "1"
          MEDIA_TOOL_TEST_PLUGIN_UID: ""
        run: bash scripts/test-updater-helper.sh
      - name: Native AMD64 media concurrency verification (real media required)
        run: go test -race -count=3 -v ./internal/modules/mediaprobe/...
      - name: Native AMD64 release worker isolation kernel gate (static, non-root)
        run: bash scripts/test-plugin-kernel.sh
      - run: go vet ./...
      - name: Production error-handling boundary (exclude private local diagnostics and test fixtures)
        run: go run github.com/kisielk/errcheck@v1.9.0 -ignoretests ./cmd/... ./internal/... ./migrations/... ./tests/...
      - name: Browser end-to-end tests (unified process)
        env:
          TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          bash scripts/test-e2e.sh
  publish:
    needs: verify
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      HUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      HUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: {fetch-depth: 0}
      - name: Validate Docker Hub configuration
        env:
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$HUB_USERNAME" && test -n "$HUB_TOKEN" && test -n "$HUB_REPOSITORY" || { echo 'Configure Docker Hub Actions variables and secret first.'; exit 1; }
          [[ "$HUB_REPOSITORY" =~ ^[a-z0-9_-]+/[a-z0-9_-]+$ ]] || exit 1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with: {go-version: '1.26.9', cache: true}
      - name: Resolve Git build metadata
        id: meta
        run: go run ./cmd/media-tool-dev build-meta github >> "$GITHUB_OUTPUT"
      - name: Refuse overwriting an existing stable release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing="$RUNNER_TEMP/existing-release.txt"
          if gh api --include "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" > "$existing"; then
            echo "Stable Release already exists; use its immutable digest instead of republishing." >&2
            exit 1
          elif ! grep -Eq '^HTTP/[0-9.]+ 404' "$existing"; then
            echo "Cannot establish that the stable Release is absent; publishing stopped." >&2
            exit 1
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push linux/amd64 only
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/Dockerfile
          build-args: |
            SOURCE_REVISION=${{ steps.meta.outputs.commit }}
            SOURCE_VERSION=${{ steps.meta.outputs.version }}
            SOURCE_BUILD_TIME=${{ steps.meta.outputs.build_time }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/dingding229/mediatool
            org.opencontainers.image.revision=${{ steps.meta.outputs.commit }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.created=${{ steps.meta.outputs.build_time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=min
      - name: Publish immutable deployment reference
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          echo "### Docker Hub release" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: \`$HUB_REPOSITORY@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Source: \`$GITHUB_SHA\`; platform: \`linux/amd64\`" >> "$GITHUB_STEP_SUMMARY"
          echo 'Deploy using scripts/update-server.sh, never upload a locally built image.' >> "$GITHUB_STEP_SUMMARY"

      - name: Create stable GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          RELEASE_COMMIT: ${{ steps.meta.outputs.commit }}
          RELEASE_SCHEMA: ${{ steps.meta.outputs.schema }}
          RELEASE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          notes="$RUNNER_TEMP/mediatool-release.md"
          go run ./cmd/media-tool-dev release-notes "$RELEASE_VERSION" "$RELEASE_DIGEST" "$RELEASE_COMMIT" "$RELEASE_SCHEMA" > "$notes"
          if gh release view "v$RELEASE_VERSION" --json body --jq .body > "$notes.existing" 2>/dev/null; then
            diff -u "$notes" "$notes.existing"
          else
            gh release create "v$RELEASE_VERSION" --verify-tag --title "v$RELEASE_VERSION" --notes-file "$notes" --latest
          fi
