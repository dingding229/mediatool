# One-time metadata recovery: the published stable image and tag are immutable.
name: Finalize existing immutable v0.52.0 Release
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: mediatool-finalize-v0520
  cancel-in-progress: false
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: 0.52.0
      SOURCE_COMMIT: 2a612d39386ec3caa25590b568303e9dda73641c
      SOURCE_RUN: '41453012690'
      DIGEST: sha256:900c575f87bbd1dd8560ac985d83d79df885a4fa08930d4ad51622f208668c9b
      REPOSITORY: dingding229/mediatool
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: {fetch-depth: 0}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with: {go-version: '1.26.9', cache: true}
      - name: Require original gates and current full main verification
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = dingding229/mediatool
          test "$(git rev-parse "v$VERSION^{}")" = "$SOURCE_COMMIT"
          # No app, API, schema, dependency pin or runtime asset may differ.
          while IFS= read -r path; do
            case "$path" in
              CHANGELOG.md|.github/workflows/build.yml|.github/workflows/finalize-v0520.yml|internal/tooling/release_notes_test.go) ;;
              *) echo "Unexpected runtime change: $path" >&2; exit 1 ;;
            esac
          done < <(git diff --name-only "$SOURCE_COMMIT" "$GITHUB_SHA")
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > "$RUNNER_TEMP/source-run.json"
          jq -e --arg sha "$SOURCE_COMMIT" '.head_sha==$sha and .event=="push" and .head_branch=="v0.52.0" and .path==".github/workflows/build.yml" and .conclusion=="failure"' "$RUNNER_TEMP/source-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/jobs?per_page=100" > "$RUNNER_TEMP/source-jobs.json"
          jq -e '.jobs as $j | ([ $j[]|select(.name=="verify" and .conclusion=="success") ]|length)==1 and ([ $j[]|select(.name=="browser" and .conclusion=="success") ]|length)==1 and ([ $j[]|select(.name=="publish")|.steps[]|select(.name=="Build and push linux/amd64 only" and .conclusion=="success") ]|length)==1 and ([ $j[]|.steps[]|select(.conclusion=="failure")|.name ]==["Create stable GitHub Release"])' "$RUNNER_TEMP/source-jobs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&event=push&per_page=100" > "$RUNNER_TEMP/current-runs.json"
          jq -e --arg sha "$GITHUB_SHA" '.workflow_runs|any(.head_sha==$sha and .head_branch=="main" and .event=="push" and .path==".github/workflows/build.yml" and .conclusion=="success")' "$RUNNER_TEMP/current-runs.json"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Verify existing Hub digest and immutable image labels
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "https://hub.docker.com/v2/namespaces/dingding229/repositories/mediatool/tags/v$VERSION" > "$RUNNER_TEMP/hub.json"
          jq -e --arg digest "$DIGEST" '.digest==$digest and any(.images[];.os=="linux" and .architecture=="amd64")' "$RUNNER_TEMP/hub.json"
          docker pull --platform linux/amd64 "$REPOSITORY@$DIGEST"
          docker image inspect "$REPOSITORY@$DIGEST" > "$RUNNER_TEMP/image.json"
          jq -e --arg sha "$SOURCE_COMMIT" --arg v "$VERSION" '.[0]|.Architecture=="amd64" and .Os=="linux" and .Config.Labels["org.opencontainers.image.revision"]==$sha and .Config.Labels["org.opencontainers.image.version"]==$v and .Config.Labels["org.opencontainers.image.schema"]=="94"' "$RUNNER_TEMP/image.json"
      - name: Finalize Release metadata without rebuilding or changing the tag
        shell: bash
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release.md"
          go run ./cmd/media-tool-dev release-notes "$VERSION" "$DIGEST" "$SOURCE_COMMIT" 94 > "$notes"
          if gh release view "v$VERSION" --json body --jq .body > "$notes.existing" 2>/dev/null; then
            diff -u "$notes" "$notes.existing"
          else
            gh release create "v$VERSION" --verify-tag --title "v$VERSION" --notes-file "$notes" --latest
          fi
          echo "Release uses existing immutable $REPOSITORY@$DIGEST from $SOURCE_COMMIT" >> "$GITHUB_STEP_SUMMARY"
