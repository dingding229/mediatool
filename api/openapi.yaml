      - name: q
        in: query
        schema:
          type: string
          maxLength: 200
  /api/v1/member/libraries/{library}/items/{item}/poster:
    get:
      operationId: memberMediaPoster
      description: 实时验证用户/媒体库/在库资产，再读取固定TMDB图片源；no-store。
      responses:
        '200':
          description: Authorized poster
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
      security:
      - MemberSession: []
      parameters:
      - name: library
        in: path
        required: true
        schema:
          type: string
          enum:
          - movies
          - series
      - name: item
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /api/v1/member/libraries/{library}/items/{item}/playback:
    post:
      operationId: memberPlaybackReserved
      description: 预留短期可撤销播放票据；先校验播放权限与在库资产。没有权限403、不存在404、有权限但未实现501；不转授永久STRM密钥。
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
        '501':
          $ref: '#/components/responses/NotImplemented'
        '404':
          description: 媒体不存在或已离库
      security:
      - MemberSession: []
      parameters:
      - name: library
        in: path
        required: true
        schema:
          type: string
          enum:
          - movies
          - series
      - name: item
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Requested-With
        in: header
        required: true
        schema:
          type: string
          const: media-tool
components:
  securitySchemes:
    MemberSession:
      type: apiKey
      in: cookie
      name: media_tool_member_session
      description: 独立媒体用户随机会话，不能访问管理后台；Path=/api/v1/member，8小时，实时撤销。
    AdminSession:
      type: apiKey
      in: cookie
      name: media_tool_session
    PlaybackKey:
      type: apiKey
      in: query
      name: apiKey
  parameters:
    CSRFHeader:
      name: X-Requested-With
      in: header
      required: true
      schema:
        type: string
        const: media-tool
    CloudPath:
      name: path
      in: query
      required: true
      schema:
        type: string
      description: URL 编码的 CloudDrive2 完整路径，必须处于 STRM_ALLOWED_ROOTS 内。
    PickCode:
      name: pickCode
      in: query
      required: false
      schema:
        type: string
        pattern: ^[A-Za-z0-9]{1,64}$
      description: 可选真实 115 PickCode；CloudDrive2 首期仍按 path 解析。
  schemas:
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
            message:
              type: string
    FileRef:
      type: object
      additionalProperties: false
      required:
      - path
      properties:
        path:
          type: string
          minLength: 1
        pickCode:
          type: string
    Dependency:
      type: object
      required:
      - id
      - name
      - state
      - message
      properties:
        id:
          type: string
        name:
          type: string
        state:
          type: string
          enum:
          - ready
          - configured
          - not_configured
          - not_implemented
          - unavailable
          - disabled
        message:
          type: string
    SystemStatus:
      type: object
      properties:
        name:
          type: string
        version:
          type: string
        environment:
          type: string
          enum:
          - development
          - production
        phase:
          type: string
        publicUrl:
          type: string
        strmEndpoint:
          type: string
        allowedRoots:
          type: array
          items:
            type: string
        databaseConfigured:
          type: boolean
        dependencies:
          type: array
          items:
            $ref: '#/components/schemas/Dependency'
        storageConfigured:
          type: boolean
        proxyFallback:
          type: boolean
        forceProxy:
          type: boolean
        emby302Enabled:
          type: boolean
    Module:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        summary:
          type: string
        milestone:
          type: string
        stage:
          type: string
          enum:
          - planned
          - partial
          - foundation
        features:
          type: array
          items:
            type: string
    Job:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
        state:
          type: string
          enum:
          - pending
          - running
          - retry
          - succeeded
          - failed
        payload:
          type: object
        attempts:
          type: integer
        maxAttempts:
          type: integer
        lastError:
          type: string
        createdAt:
          type: string
          format: date-time
    Integration:
      type: object
      required:
      - id
      - kind
      - name
      - enabled
      - settings
      - secretFields
      - revision
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - clouddrive2
          - qbittorrent
          - emby
          - tmdb
          - telegram
          - ptsite
        name:
          type: string
        enabled:
          type: boolean
        settings:
          type: object
        secretFields:
          type: array
          items:
            type: string
        revision:
          type: integer
        lastCheckState:
          type: string
        lastCheckMessage:
          type: string
    IntegrationInput:
      type: object
      additionalProperties: false
      required:
      - kind
      - name
      - enabled
      - settings
      properties:
        kind:
          type: string
        name:
          type: string
        enabled:
          type: boolean
        settings:
          type: object
        secrets:
          type: object
          additionalProperties:
            type: string
          writeOnly: true
        revision:
          type: integer
    SubscriptionInput:
      type: object
      additionalProperties: false
      required:
      - mediaType
      - tmdbId
      - rules
      properties:
        mediaType:
          enum:
          - movie
          - series
        tmdbId:
          type: integer
          minimum: 1
        enabled:
          type: boolean
          default: false
        source:
          enum:
          - search
          - rss
          - both
          default: search
        intervalMinutes:
          type: integer
          minimum: 5
          maximum: 1440
          default: 30
        revision:
          type: integer
        rules:
          type: object
          additionalProperties: false
          properties:
            accountIds:
              type: array
              minItems: 1
              maxItems: 10
              items:
                type: string
                format: uuid
            keyword:
              type: string
            include:
              type: array
              items:
                type: string
            exclude:
              type: array
              items:
                type: string
            minSize:
              type: integer
              minimum: 0
            maxSize:
              type: integer
              minimum: 0
            minSeeders:
              type: integer
              minimum: 0
            freeOnly:
              type: boolean
            allowUnknownHR:
              type: boolean
              default: false
            season:
              type: integer
              minimum: 0
              maximum: 999
            episodes:
              type: array
              items:
                type: integer
                minimum: 1
            includeHistory:
              type: boolean
              default: false
  responses:
    OK:
      description: 请求成功，数据包装在 data 字段中。
    BadRequest:
      description: 请求无效。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: 凭据不存在、无效或过期。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 来源或防跨站请求标识无效。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: 依赖未配置、不可用或数据库尚未迁移。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotImplemented:
      description: 明确保留的接口，业务逻辑尚未实现。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
