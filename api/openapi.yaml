openapi: 3.1.0
info:
  title: Media Tool framework API
  version: 0.9.0-dev
  description: 'Offline hardening beta: database-driven playback validation, durable encrypted artifact journal, fenced upload
    controls, paginated library/batch confirmation/identity correction, subtree scan schedules, offline master-key rekey and
    pinned public Emby origin. Real-provider acceptance remains separate.'
servers:
- url: /
security:
- AdminSession: []
paths:
  /healthz:
    get:
      operationId: liveness
      security: []
      responses:
        '200':
          $ref: '#/components/responses/OK'
  /readyz:
    get:
      operationId: readiness
      security: []
      description: 生产要求 PostgreSQL 可用；Redis 作为缓存故障仅降级。
      responses:
        '200':
          $ref: '#/components/responses/OK'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/settings/application:
    get:
      operationId: getApplicationSettings
      description: 读取命名模板、缓存有效期和Emby用户选择
      responses:
        '200':
          $ref: '#/components/responses/OK'
  /api/v1/logs/summary:
    get:
      operationId: logSummary
      description: 文件日志大小、轮转上限和当前级别；不含恢复控制台密码
      responses:
        '200':
          $ref: '#/components/responses/OK'
  /api/v1/logs:
    get:
      operationId: readLogs
      description: 最近100条脱敏JSON日志，可用level及limit筛选
      responses:
        '200':
          $ref: '#/components/responses/OK'
  /api/v1/logs/clear:
    post:
      operationId: clearLogs
      description: 需confirm=true；清理文件日志，不删数据库审计或Docker控制台
      responses:
        '200':
          $ref: '#/components/responses/OK'
  /api/v1/logs/level:
    post:
      operationId: setLogLevel
      description: debug/info/warn/error，运行时切换默认值在Compose
      responses:
        '200':
          $ref: '#/components/responses/OK'
  /api/v1/data/postgres/tables:
    get:
      operationId: postgresTables
      description: 公共业务表列表，管理员只读
      responses:
        '200':
          $ref: '#/components/responses/OK'
  /api/v1/data/postgres/tables/{table}:
    get:
      operationId: postgresRows
      description: 有界分页、只读事务、字段敏感信息隐藏
      responses:
        '200':
          $ref: '#/components/responses/OK'
  /api/v1/data/redis/keys:
    get:
      operationId: redisKeys
      description: SCAN游标分页，只读类型/TTL/大小
      responses:
        '200':
          $ref: '#/components/responses/OK'
  /api/v1/data/redis/value:
    get:
      operationId: redisValue
      description: 有界格式化内容，敏感键、签名URL和认证数据隐藏
      responses:
        '200':
          $ref: '#/components/responses/OK'
  /api/v1/media/recognize-name:
    post:
      operationId: recognizeRelease
      description: Scene/0day文件名线索，不直接确认TMDB身份
      responses:
        '200':
          $ref: '#/components/responses/OK'
  /api/v1/media/organize-history:
    get:
      operationId: organizeHistory
      description: 真实整理执行、源/目标和对账状态的分页历史
      responses:
        '200':
          $ref: '#/components/responses/OK'
  /api/v1/media/library/emby/home:
    get:
      operationId: embyHome
      description: 选定用户范围的分类、播放、继续/近期观看和最新媒体；后端使用API Key
      responses:
        '200':
          $ref: '#/components/responses/OK'
  /api/v1/search/media:
    get:
      operationId: searchTMDB
      description: 电影/剧集关键词与年份筛选，返回缓存命中，缓存按配置修订隔离
      responses:
        '200':
          $ref: '#/components/responses/OK'
  /api/v1/plugins:
    get:
      operationId: listPlugins
      description: 内置能力与停用/启用的受约束HTTPS扩展Manifest
      responses:
        '200':
          $ref: '#/components/responses/OK'
  /api/v1/auth/login:
    post:
      operationId: login
      security: []
      parameters:
      - $ref: '#/components/parameters/CSRFHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - username
              - password
              properties:
                username:
                  type: string
                  maxLength: 128
                password:
                  type: string
                  format: password
                  maxLength: 128
      responses:
        '200':
          description: 建立八小时 HttpOnly/SameSite 会话；生产 cookie 仅 HTTPS。
          headers:
            Set-Cookie:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: 账号或密码不正确，未知账号使用相同响应
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          description: 持久化尝试限流或密码计算并发已满
        '503':
          $ref: '#/components/responses/Unavailable'
      description: 使用首次注册的管理员账号密码登录，返回HttpOnly/SameSite会话Cookie；不接受启动Key或BearerKey。 新设置密码为6–20个字符；登录及当前密码允许历史长密码，以避免已有账号被锁定。
  /api/v1/auth/logout:
    post:
      operationId: logout
      parameters:
      - $ref: '#/components/parameters/CSRFHeader'
      responses:
        '200':
          $ref: '#/components/responses/OK'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/auth/session:
    get:
      operationId: session
      responses:
        '200':
          $ref: '#/components/responses/OK'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/system/status:
    get:
      operationId: systemStatus
      responses:
        '200':
          description: 实际依赖健康，不返回凭据；外部适配器未实测不标记 ready。
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/SystemStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/system/modules:
    get:
      operationId: modules
      responses:
        '200':
          description: 模块建设状态，不表示真实服务已接入。
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Module'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/jobs:
    get:
      operationId: listJobs
      responses:
        '200':
          description: 最近 100 条 PostgreSQL 任务；空队列返回空数组。
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      operationId: createSystemCheck
      parameters:
      - $ref: '#/components/parameters/CSRFHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - kind
              properties:
                kind:
                  type: string
                  enum:
                  - system.check
      responses:
        '201':
          description: 事务创建任务和 Outbox，Worker 启动后领取。
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/jobs/events:
    get:
      operationId: jobInvalidationEvents
      description: '每三秒发送 event: tick。仅刷新提示，不是持久化业务事件。 重连后查询 /jobs 恢复状态，原生 EventSource 使用会话 cookie。'
      responses:
        '200':
          description: SSE 流。
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/strm/preview:
    post:
      operationId: previewStrm
      parameters:
      - $ref: '#/components/parameters/CSRFHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileRef'
      responses:
        '200':
          description: 敏感固定链接预览；不是云端直链，也不写入服务器目录。
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required:
                    - url
                    - content
                    - warning
                    properties:
                      url:
                        type: string
                      content:
                        type: string
                      warning:
                        type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/cloudStorage/strm302:
    get:
      operationId: resolveStrm
      security:
      - PlaybackKey: []
      parameters:
      - $ref: '#/components/parameters/CloudPath'
      - $ref: '#/components/parameters/PickCode'
      - name: assetId
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: File-grant mode; current indexed path is authoritative. Legacy path/pickCode mode remains conditional.
      description: Legacy global-Key/path links or assetId/file-Key links; file authorization precedes cache. Moved indexed
        files retain assetId links. Cache is context/version isolated and no reliable expiry means no cache. 302 failure after
        redirect is not observable server-side. 固定入口总取链默认30秒（PLAYBACK_RESOLVE_TIMEOUT允许5秒到1分钟）；仍核对官方文件身份、实际UA和目标策略，超时返回504。不改变STRM原链接。
      responses:
        '200':
          description: 受控媒体代理返回视频/音频/octet-stream，不回传上游凭据。
        '206':
          description: 受控代理的 Range 响应，保留 Content-Range/Accept-Ranges。
        '302':
          description: 临时直链，不长期缓存。
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri
            Cache-Control:
              schema:
                type: string
                const: no-store
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 云端文件不存在。
        '409':
          description: 直链需要代理但 STRM_PROXY_FALLBACK 与 STRM_FORCE_PROXY 都未启用。
        '416':
          description: 上游范围请求无效。
        '502':
          description: 上游不可达/认证失败/权限不足/RPC 不兼容/无直链/过期/目标不安全/非媒体响应。
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          description: cloud_resolution_timeout：总取链/网络预算耗尽，无Location、不回退服务器中转；具体固定阶段与requestId在安全日志中可核对。
    head:
      operationId: probeStrm
      security:
      - PlaybackKey: []
      parameters:
      - $ref: '#/components/parameters/CloudPath'
      - $ref: '#/components/parameters/PickCode'
      - name: assetId
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: File-grant mode; current indexed path is authoritative. Legacy path/pickCode mode remains conditional.
      responses:
        '200':
          description: 受控代理 HEAD，成功响应无主体。
        '206':
          description: 受控代理 Range HEAD。
        '302':
          description: 与 GET 相同解析逻辑，成功响应无主体。
        default:
          description: 与 GET 相同错误语义，HEAD 由 net/http 抑制响应主体。
  /api/v1/sites:
    get:
      operationId: reservedSites
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'
  /api/v1/search:
    get:
      operationId: listSearchRuns
      description: Recent durable searches
      parameters: []
      responses:
        '200':
          description: Recent durable searches
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {}
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict or unsafe retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Dependency unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createSearchRun
      description: Queue a multi-account search
      parameters:
      - &id001
        $ref: '#/components/parameters/CSRFHeader'
      responses:
        '200':
          description: Queue a multi-account search
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {}
        '202':
          description: Work accepted; poll its durable state
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {}
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict or unsafe retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Dependency unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - keyword
              - accountIds
              properties:
                keyword:
                  type: string
                accountIds:
                  type: array
                  items:
                    type: string
                    format: uuid
              additionalProperties: false
  /api/v1/subscriptions:
    get:
      operationId: listSubscriptions
      description: Authenticated management operation; secrets/raw temporary download URLs are not returned.
      parameters: []
      responses:
        '200':
          description: Operation result in data envelope
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Revision, outcome, or safety conflict
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      operationId: createSubscription
      description: Authenticated management operation; secrets/raw temporary download URLs are not returned.
      parameters:
      - $ref: '#/components/parameters/CSRFHeader'
      responses:
        '200':
          description: Operation result in data envelope
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Revision, outcome, or safety conflict
        '503':
          $ref: '#/components/responses/Unavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionInput'
  /api/v1/downloads:
    get:
      operationId: listDownloads
      description: Durable download, seeding and library states
      parameters: []
      responses:
        '200':
          description: Durable download, seeding and library states
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {}
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict or unsafe retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Dependency unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createDownload
      description: Confirm TMDB identity then enqueue qBittorrent download
      parameters:
      - *id001
      responses:
        '200':
          description: Confirm TMDB identity then enqueue qBittorrent download
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {}
        '202':
          description: Work accepted; poll its durable state
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {}
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict or unsafe retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Dependency unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - resourceId
              - mediaType
              - tmdbId
              properties:
                searchRunId:
                  type: string
                  format: uuid
                  description: Selected result snapshot; omitted old clients use the latest valid snapshot, never an unproven historical resource row.
                resourceId:
                  type: string
                  format: uuid
                mediaType:
                  type: string
                  enum:
                  - movie
                  - series
                tmdbId:
                  type: integer
                  minimum: 1
              additionalProperties: false
  /api/v1/cloudStorage:
    get:
      operationId: reservedStorage
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'
  /api/v1/notifications:
    get:
      operationId: listNotifications
      description: Site inbox and Telegram delivery state
      parameters: []
      responses:
        '200':
          description: Site inbox and Telegram delivery state
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {}
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict or unsafe retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Dependency unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/cloudStorage/test:
    post:
      operationId: testCloudDrive
      description: 只读验证 CloudDrive2 就绪、认证及路径权限；path 省略时使用配置的第一个根目录。
      parameters:
      - $ref: '#/components/parameters/CSRFHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                path:
                  type: string
      responses:
        '200':
          description: data 包含 systemReady、loggedIn、pathReadable 和 file；不包含云盘账号或凭据。
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          description: 上游认证、RPC、响应或安全目标校验失败。
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/cloudStorage/diagnose:
    post:
      operationId: diagnoseCloudFile
      description: 验证文件与当前直链访问条件，不读取视频字节。返回模式而非临时 URL。
      parameters:
      - $ref: '#/components/parameters/CSRFHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileRef'
      responses:
        '200':
          description: data 包含 file、playback(mode/expiresAt/requiresUserAgent/requiresHeaders/targetValidated/mediaBytesChecked=false)、note。
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          description: 上游认证、RPC、响应或安全目标校验失败。
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/emby/test:
    post:
      operationId: testEmbyPublicInfo
      description: 检查 Emby 公共信息接口可达；不代表用户权限或真实播放成功。
      parameters:
      - $ref: '#/components/parameters/CSRFHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: data 包含 reachable、version、clientPlaybackVerified=false、note。
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          description: 上游认证、RPC、响应或安全目标校验失败。
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/emby/check:
    post:
      operationId: checkEmbyUserItem
      description: 使用提供的 Emby 用户令牌查询 /Users/Me 和授权媒体；令牌不存储、不记录，也不使用管理员服务令牌替代。
      parameters:
      - $ref: '#/components/parameters/CSRFHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - itemId
              - userToken
              properties:
                itemId:
                  type: string
                mediaSourceId:
                  type: string
                userToken:
                  type: string
                  writeOnly: true
      responses:
        '200':
          description: data 包含 authenticated、canPlay、sourceMapped、mediaBytesChecked=false。
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          description: 上游认证、RPC、响应或安全目标校验失败。
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/integrations:
