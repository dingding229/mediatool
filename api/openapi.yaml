openapi: 3.1.0
info:
  title: Media Tool framework API
  version: 0.21.0-dev
  description: 'Offline hardening beta: database-driven playback validation, durable encrypted artifact journal, fenced upload
    controls, paginated library/batch confirmation/identity correction, subtree scan schedules, offline master-key rekey and
    pinned public Emby origin. Real-provider acceptance remains separate.'
servers:
- url: /
security:
- AdminSession: []
paths:
  /api/v1/cloud/accounts/info:
    get:
      operationId: cloudAccountInfo
      description: 当前已启用CloudDrive2挂载的只读空间/会员信息；包含来源和时间，部分错误明确返回，不猜测115会员到期。
      responses:
        '200':
          $ref: '#/components/responses/OK'
        '409':
          description: 连接未配置、修订变化或记录未结束
  /api/v1/settings/naming-preview:
    post:
      operationId: namingPreview
      description: movieTemplate/seriesTemplate受限相对路径模板示例；videoFormat为分辨率，season_episode为确认季集，自动扩展名。
      responses:
        '200':
          $ref: '#/components/responses/OK'
        '409':
          description: 连接未配置、修订变化或记录未结束
  /api/v1/library/activity/remove:
    post:
      operationId: removeLibraryHistory
      description: confirm=true+items(kind/id/updatedAt)移除1–50条已结束历史显示；媒体、审计和恢复证据保留，未知/待恢复不可移除。
      responses:
        '200':
          $ref: '#/components/responses/OK'
        '409':
          description: 连接未配置、修订变化或记录未结束
  /api/v1/files/batches/preview:
    post:
      operationId: previewFileBatch
      description: 持久化逐项整理预览；1–20项。不会执行文件变更，冲突项阻止整批批准。
      responses:
        '200':
          $ref: '#/components/responses/OK'
        '409':
          description: 证据变化、冲突或当前状态不允许
  /api/v1/files/batches/{id}:
    get:
      operationId: getFileBatch
      description: 逐项计划、执行进度和原始核对结果。
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          $ref: '#/components/responses/OK'
        '409':
          description: 证据变化、冲突或当前状态不允许
  /api/v1/files/batches/{id}/approve:
    post:
      operationId: approveFileBatch
      description: digest+confirm=true明确批准；预览未过期、无冲突才入library队列；重复批准不重复任务。
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          $ref: '#/components/responses/OK'
        '409':
          description: 证据变化、冲突或当前状态不允许
  /api/v1/files/batches/{id}/reconcile:
    post:
      operationId: reconcileFileBatch
      description: 只读回核对未知结果，不重放移动、不自动继续未执行项。
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          $ref: '#/components/responses/OK'
        '409':
          description: 证据变化、冲突或当前状态不允许
  /api/v1/library/scans/{id}:
    get:
      operationId: scanDetails
      description: 目录游标分页、已知覆盖、代次和连接修订；进度不是预先已知的全树百分比。
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          $ref: '#/components/responses/OK'
        '409':
          description: 证据变化、冲突或当前状态不允许
  /api/v1/library/scans/{id}/{action}:
    post:
      operationId: controlScan
      description: pause/resume/cancel；resume重新全树校准，旧代次与不完整覆盖不参与缺失投票。
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: action
        in: path
        required: true
        schema: {type: string, enum: [pause, resume, cancel]}
      responses:
        '200':
          $ref: '#/components/responses/OK'
        '409':
          description: 证据变化、冲突或当前状态不允许
  /api/v1/library/candidates/{id}/recognize:
    post:
      operationId: recognizeCandidate
      description: 绑定当前文件ID、路径、大小和候选修订的识别证据；唯一标题+年份+类型才预选，仍需人工批准。
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          $ref: '#/components/responses/OK'
        '409':
          description: 证据变化、冲突或当前状态不允许
  /api/v1/library/activity:
    get:
      operationId: libraryActivity
      description: 统一文件/批次/扫描/传输/输出/Emby历史。kind,state,q,connectionId,batchId,from,to,page,pageSize筛选；日期RFC3339。
      responses:
        '200':
          $ref: '#/components/responses/OK'
        '409':
          description: 证据变化、冲突或当前状态不允许
  /api/v1/library/outputs:
    get:
      operationId: managedOutputs
      description: 托管文件集合和输出归属、云端状态、按资产修订的逐路径Emby可见性；q/page/pageSize。
      responses:
        '200':
          $ref: '#/components/responses/OK'
        '409':
          description: 证据变化、冲突或当前状态不允许
  /api/v1/library/outputs/{id}/content:
    get:
      operationId: managedOutputContent
      description: 核对托管归属与当前SHA256后返回原STRM/NFO正文，保留原链接；path相对路径，no-store，256KiB上限。未知或手工改变文件返回409，不读取、不覆盖。
      parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: path, in: query, required: true, schema: {type: string}}
      responses:
        '200':
          $ref: '#/components/responses/OK'
        '409':
          description: 非托管、缺失或文件改变
  /api/v1/library/outputs/{id}/emby:
    post:
      operationId: checkManagedEmby
      description: 排队定向路径刷新，再逐路径确认可见；刷新成功不代表入库、可见不代表完整解码。
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          $ref: '#/components/responses/OK'
        '409':
          description: 证据变化、冲突或当前状态不允许
  /healthz:
    get:
      operationId: liveness
      security: []
      responses:
        '200':
          $ref: '#/components/responses/OK'
  /readyz:
    get:
      operationId: readiness
      security: []
      description: 生产要求 PostgreSQL 可用；Redis 作为缓存故障仅降级。
      responses:
        '200':
          $ref: '#/components/responses/OK'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/settings/application:
    get:
      operationId: getApplicationSettings
      description: 读取命名模板、缓存有效期和Emby用户选择
      responses:
        '200':
          $ref: '#/components/responses/OK'
  /api/v1/logs/summary:
    get:
      operationId: logSummary
      description: 文件日志大小、轮转上限和当前级别；不含恢复控制台密码
      responses:
        '200':
          $ref: '#/components/responses/OK'
  /api/v1/logs:
    get:
      operationId: readLogs
      description: 最近100条管理员原值JSON日志，可用level及limit筛选
      responses:
        '200':
          $ref: '#/components/responses/OK'
  /api/v1/logs/query:
    get:
      operationId: queryLogs
      description: >-
        分页查询管理员原值文件日志。keyword（至多200字）、level、module、from/to/before（RFC3339）、
        page（1-10000）、pageSize（1-200）。返回items/total/modules/before/truncated。
        total仅代表每文件最近2MiB且至多20000条的扫描窗口，不代表全部保留日志。
        before为查询截止时间；分页复用该时间可排除新写日志，大量写入、轮转或清理仍可能使窗口变化。
      responses:
        '200':
          $ref: '#/components/responses/OK'
        '400':
          description: 筛选、时间范围或页码无效
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/logs/clear:
    post:
      operationId: clearLogs
      description: 需confirm=true；清理文件日志，不删数据库审计或Docker控制台
      responses:
        '200':
          $ref: '#/components/responses/OK'
  /api/v1/logs/level:
    post:
      operationId: setLogLevel
      description: debug/info/warn/error，运行时切换默认值在Compose
      responses:
        '200':
          $ref: '#/components/responses/OK'
  /api/v1/data/postgres/tables:
    get:
      operationId: postgresTables
      description: 公共业务表列表，管理员只读
      responses:
        '200':
          $ref: '#/components/responses/OK'
  /api/v1/data/postgres/tables/{table}:
    get:
      operationId: postgresRows
      description: 有界分页、只读事务、字段敏感信息隐藏
      responses:
        '200':
          $ref: '#/components/responses/OK'
  /api/v1/data/redis/keys:
    get:
      operationId: redisKeys
      description: SCAN游标分页，只读类型/TTL/大小
      responses:
        '200':
          $ref: '#/components/responses/OK'
  /api/v1/data/redis/value:
    get:
      operationId: redisValue
      description: 有界格式化内容，敏感键、签名URL和认证数据隐藏
      responses:
        '200':
          $ref: '#/components/responses/OK'
  /api/v1/media/recognize-name:
    post:
      operationId: recognizeRelease
      description: Scene/0day文件名线索，不直接确认TMDB身份
      responses:
        '200':
          $ref: '#/components/responses/OK'
  /api/v1/media/organize-history:
    get:
      operationId: organizeHistory
      description: 真实整理执行、源/目标和对账状态的分页历史
      responses:
        '200':
          $ref: '#/components/responses/OK'
  /api/v1/media/library/emby/home:
    get:
      operationId: embyHome
      description: 选定用户范围的分类、播放、继续/近期观看和最新媒体；后端使用API Key
      responses:
        '200':
          $ref: '#/components/responses/OK'
  /api/v1/search/media:
    get:
      operationId: searchTMDB
      description: 默认auto使用TMDB multi搜索电影和剧集（不含人物）；0day提取标题/年份线索；缓存按类型/配置区分
      parameters:
      - {name: mediaType, in: query, schema: {type: string, enum: [auto, movie, series], default: auto}}
      - {name: q, in: query, required: true, schema: {type: string, maxLength: 200}}
      - {name: year, in: query, schema: {type: string}}
      - {name: refresh, in: query, schema: {type: boolean}}
      responses:
        '200':
          $ref: '#/components/responses/OK'
  /api/v1/plugins:
    get:
      operationId: listPlugins
      description: 内置能力与停用/启用的受约束HTTPS扩展Manifest
      responses:
        '200':
          $ref: '#/components/responses/OK'
  /api/v1/plugins/package:
    post:
      operationId: installPluginZIP
      description: 8MiB ZIP（展开24MiB），支持rules/webhook/WASM及UI；同摘要和revision确认安装，默认停用。
      parameters:
      - $ref: '#/components/parameters/CSRFHeader'
      - {name: preview, in: query, schema: {type: boolean}}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [package]
              properties:
                package: {type: string, format: binary}
                digest: {type: string}
                confirm: {type: string, enum: ['true']}
                revision: {type: string}
      responses:
        '200': {$ref: '#/components/responses/OK'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {description: 安装修订冲突或未确认}
  /api/v1/plugins/{id}/settings:
    get:
      operationId: readPluginSettings
      description: 管理员原始设置，存储仍加密
      parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {$ref: '#/components/responses/OK'}
    put:
      operationId: writePluginSettings
      description: 加密保存；秘密空值保留、clear明确清除；保存后停用
      parameters:
      - $ref: '#/components/parameters/CSRFHeader'
      - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision, values]
              properties:
                revision: {type: integer, minimum: 1}
                values: {type: object, additionalProperties: {type: string}}
                clear: {type: array, items: {type: string}}
      responses:
        '200': {$ref: '#/components/responses/OK'}
        '409': {description: 设置无效或修订冲突}
  /api/v1/plugins/{id}/test:
    post:
      operationId: testPlugin
      description: 明确confirm=true；测试不写媒体，管理员原始结果，无自动重发
      parameters:
      - $ref: '#/components/parameters/CSRFHeader'
      - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: {type: boolean, const: true}
                filename: {type: string, maxLength: 1024}
      responses:
        '200': {$ref: '#/components/responses/OK'}
        '502': {description: 未启用或执行失败}
  /api/v1/plugins/{id}/runs:
    get:
      operationId: listPluginRuns
      description: 最近100次执行，失败/unknown不表示自动重试
      parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {$ref: '#/components/responses/OK'}
  /api/v1/plugins/{id}:
    delete:
      operationId: uninstallPlugin
      description: 删除插件配置/执行记录，不删除媒体
      parameters:
      - $ref: '#/components/parameters/CSRFHeader'
      - {name: id, in: path, required: true, schema: {type: string}}
      - {name: confirm, in: query, required: true, schema: {type: boolean, const: true}}
      - {name: revision, in: query, required: true, schema: {type: integer, minimum: 1}}
      responses:
        '200': {$ref: '#/components/responses/OK'}
        '409': {description: 修订冲突}
  /api/v1/sites/metrics:
    get:
      operationId: readSiteMetrics
      description: 最近成功统计，未知null；账号/定义改变及采集失败标记旧快照
      responses:
        '200': {$ref: '#/components/responses/OK'}
  /api/v1/sites/metrics/sync:
    post:
      operationId: syncSiteMetrics
      description: 单站或最多16启用站，75秒总预算/每站15秒；失败保留快照，配置改变不写旧数据
      parameters:
      - $ref: '#/components/parameters/CSRFHeader'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                accountId: {type: string}
      responses:
        '200': {$ref: '#/components/responses/OK'}
        '503': {description: 存储不可用或结果未确认}
  /api/v1/plugin-market/repositories:
    get:
      operationId: get__api_v1_plugin_market_repositories
      description: 插件仓库列表/添加
      parameters: []
      responses:
        '200':
          $ref: '#/components/responses/OK'
        '401':
          description: 需要管理员会话
        '409':
          description: 确认/修订/能力冲突
    post:
      operationId: post__api_v1_plugin_market_repositories
      description: 插件仓库列表/添加
      parameters:
      - $ref: '#/components/parameters/CSRFHeader'
      responses:
        '200':
          $ref: '#/components/responses/OK'
        '401':
          description: 需要管理员会话
        '409':
          description: 确认/修订/能力冲突
  /api/v1/plugin-market/repositories/{id}:
    delete:
      operationId: delete__api_v1_plugin_market_repositories_id
      description: 确认删除自定义仓库
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/CSRFHeader'
      responses:
        '200':
          $ref: '#/components/responses/OK'
        '401':
          description: 需要管理员会话
        '409':
          description: 确认/修订/能力冲突
  /api/v1/plugin-market/repositories/{id}/catalog:
    get:
      operationId: get__api_v1_plugin_market_repositories_id_catalog
      description: 有界HTTPS公开清单
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/OK'
        '401':
          description: 需要管理员会话
        '409':
          description: 确认/修订/能力冲突
  /api/v1/plugin-market/package:
    post:
      operationId: post__api_v1_plugin_market_package
      description: 同摘要及身份预览/确认升级
      parameters:
      - $ref: '#/components/parameters/CSRFHeader'
      responses:
        '200':
          $ref: '#/components/responses/OK'
        '401':
          description: 需要管理员会话
        '409':
          description: 确认/修订/能力冲突
  /api/v1/plugins/{id}/state:
    get:
      operationId: get__api_v1_plugins_id_state
      description: 管理员原始实例数据/状态
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/OK'
        '401':
          description: 需要管理员会话
        '409':
          description: 确认/修订/能力冲突
  /api/v1/plugins/{id}/data:
    delete:
      operationId: delete__api_v1_plugins_id_data
      description: 确认清理实例数据并停用
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/CSRFHeader'
      responses:
        '200':
          $ref: '#/components/responses/OK'
        '401':
          description: 需要管理员会话
        '409':
          description: 确认/修订/能力冲突
  /api/v1/plugins/{id}/clone:
    post:
      operationId: post__api_v1_plugins_id_clone
      description: 停用分身：代码/配置复制，数据服务独立
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/CSRFHeader'
      responses:
        '200':
          $ref: '#/components/responses/OK'
        '401':
          description: 需要管理员会话
        '409':
          description: 确认/修订/能力冲突
  /api/v1/plugins/{id}/ui:
    get:
      operationId: get__api_v1_plugins_id_ui
      description: 隔离自定义UI，no-store/无网络/无同源
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/OK'
        '401':
          description: 需要管理员会话
        '409':
          description: 确认/修订/能力冲突
  /api/v1/plugins/{id}/view/{kind}/{key}:
    get:
      operationId: get__api_v1_plugins_id_view_kind_key
      description: 声明页面/仪表盘/API/命令，写操作确认
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: kind
        in: path
        required: true
        schema:
          type: string
      - name: key
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/OK'
        '401':
          description: 需要管理员会话
        '409':
          description: 确认/修订/能力冲突
    post:
      operationId: post__api_v1_plugins_id_view_kind_key
      description: 声明页面/仪表盘/API/命令，写操作确认
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: kind
        in: path
        required: true
        schema:
          type: string
      - name: key
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/CSRFHeader'
      responses:
        '200':
          $ref: '#/components/responses/OK'
        '401':
          description: 需要管理员会话
        '409':
          description: 确认/修订/能力冲突
  /api/v1/plugins/{id}/services/{key}:
    post:
      operationId: post__api_v1_plugins_id_services_key
      description: 当前修订服务单次触发
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: key
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/CSRFHeader'
      responses:
        '200':
          $ref: '#/components/responses/OK'
        '401':
