        '409':
          description: Changed snapshot, conflict, protected path or busy operation
  /api/v1/files/operations/{id}/execute:
    post:
      operationId: executeFileOperation
      description: Explicit confirmation plus server plan digest; never automatically replay unknown commits
      parameters:
        - in: path
          name: id
