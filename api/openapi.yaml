  /api/v1/integrations/{id}/115/auth/start:
    post:
      operationId: official115AuthorizationStart
      description: Create a private PKCE QR session for the administrator using their own AppID. Does not enable playback
        or return tokens.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: Private authorization state; access and refresh tokens are never returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      sessionId:
                        type: string
                      state:
                        type: string
                        enum:
                        - waiting
                        - scanned
                        - exchanging
                        - authorized
                        - expired
                        - cancelled
                        - failed
                      qrCodeImage:
                        type: string
                        description: Locally generated private PNG data URI, present only on start
                      expiresAt:
                        type: string
                        format: date-time
        '401':
          description: Administrator login required
        '403':
          description: Same-origin CSRF verification required
        '409':
          description: Session expired, replaced, or configuration changed
        '502':
          description: Official authorization unavailable; no credentials exposed
