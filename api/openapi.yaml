        '409':
          description: 策略、归属、预览证明、已有批准或文件状态冲突；请核对后明确重试
  /api/v1/transfers/{id}/output-preview:
    get:
      operationId: previewOutputImportRecovery
      description: 管理员只读原输出核对，返回相对路径、assetId、修订、needsMigration/needsArtifactRecovery/ready和planDigest；不返回URL/Key、源正文或绝对目录。已有布局不一致须先明确迁移。
      parameters:
      - &id005
        name: id
        in: path
        required: true
        schema: *id004
      responses: &id006
        '200':
          $ref: '#/components/responses/OK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 预览/控制修订/文件/绑定或已有批准变化，重新核对，不自动重建上传。
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/transfers/{id}/resume-import:
    post:
      operationId: approveOutputImportRecovery
      description: 显式批准专用入库恢复，不创建上传、不改已确认身份/STRM/NFO；同一证明和控制修订批准回放不新增Job。Worker再验摘要，变化需人工核对；成功仅代表持久化/排队，不是播放完成。
      parameters:
      - *id005
      - $ref: '#/components/parameters/CSRFHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - controlRevision
              - planDigest
              properties:
                controlRevision:
                  type: integer
                  minimum: 1
                planDigest:
                  type: string
                  pattern: ^[0-9a-f]{64}$
      responses: *id006
  /api/v1/downloads/{id}/source-preview:
    get:
      summary: Read a guarded download-source reconfirmation plan
      description: Reads PT torrent metadata and filtered qB state; never submits a torrent. Private URLs and credentials are omitted.
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
        - in: query
          name: searchRunId
          schema: {type: string, format: uuid}
      responses:
        '200': {description: Source identity, eligibility, control revision and plan digest}
        '409': {description: Snapshot or task must be refreshed}
  /api/v1/downloads/{id}/reconfirm-source:
    post:
      summary: Explicitly resume the original pending task from an approved source
      description: Requires current preview proof and consent; preserves media, downloader and paths. Exact approval replay never resets newer work.
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [searchRunId, controlRevision, planDigest, confirmSourceBinding]
              properties:
                searchRunId: {type: string, format: uuid}
                controlRevision: {type: integer, minimum: 1}
                planDigest: {type: string, minLength: 64, maxLength: 64}
                confirmSourceBinding: {type: boolean}
                confirmInitialIdentity: {type: boolean}
      responses:
        '202': {description: Original task resumed or exact request already applied}
        '409': {description: Task, source, rules or downloader observation changed}

  /api/v1/files/roots:
    get:
      operationId: listFileRoots
      description: List explicit enabled cloud/local file roots
      parameters: []
      responses:
        '200':
          description: Operation response or read-only result
        '401':
          description: Administrator session required
        '409':
          description: Changed snapshot, conflict, protected path or busy operation
  /api/v1/files:
