<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:16px/1.8 system-ui;background:#f5f6f8;color:#202c38;padding:24px}button{background:#146e63;color:white;padding:12px 20px;border:0;border-radius:8px;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><h2>插件自定义页面</h2><p>这个页面在隔离沙箱运行，无法访问主程序会话或直接访问网络；通过实例桥接读取自己的数据。</p><button id="load">读取本插件数据</button><pre id="result">尚未读取</pre><script>document.getElementById('load').onclick=()=>parent.postMessage({type:'media-tool-plugin',requestId:'data-'+Date.now(),action:'data'},'*');window.addEventListener('message',event=>{if(event.source===parent&&event.data?.type==='media-tool-plugin-result')document.getElementById('result').textContent=JSON.stringify(event.data,null,2)})</script></body></html>
