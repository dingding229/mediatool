# 唯一部署文件：直接编辑此文件，不使用 ${...} 或部署 .env。
# 首次运行先执行 python3 scripts/init-compose.py 生成私密密钥/数据库密码。
# 公开仓库中的此文件为模板；填写后的服务器文件必须保持0600且不可提交。
name: media-tool
x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "5"}
services:
  app:
    image: dingding229/mediatool:latest
    platform: linux/amd64
    environment:
      APP_ENV: development
      APP_ADDR: 0.0.0.0:8080
      APP_PUBLIC_URL: http://localhost:8080
      AUTH_ALLOWED_ORIGINS: "" # 显式填写反代域名，例如 https://media.example.com
      HOST_PROC_DIR: /host/proc
      TZ: Asia/Shanghai
      EMBY_GATEWAY_ADDR: 0.0.0.0:8091
      EMBY_PUBLIC_URL: ""
      APP_SECRET_KEY: CHANGE_ME_APP_SECRET_KEY
      SESSION_SECRET_KEY: CHANGE_ME_SESSION_SECRET_KEY
      STRM_API_KEY: CHANGE_ME_STRM_API_KEY
      DATABASE_URL: postgres://media_tool:CHANGE_ME_POSTGRES_PASSWORD@postgres:5432/media_tool?sslmode=disable
      REDIS_URL: redis://:CHANGE_ME_REDIS_PASSWORD@redis:6379/0
      STRM_ALLOWED_ROOTS: /115
      STRM_OUTPUT_DIR: /data/strm
      LOCAL_BROWSE_ROOTS: /data,/mnt,/media
      PASSWORD_RESET_FILE: /data/password
      OPS_DATA_DIR: /data/maintenance
      APP_LOG_DIR: /data/logs
      LOG_LEVEL: info
      STRM_LEGACY_KEY_ENABLED: "true"
      STRM_PROXY_FALLBACK: "false"
      STRM_FORCE_PROXY: "false"
      PLAYBACK_ALLOW_HTTP: "false"
      PLAYBACK_ALLOWED_HOSTS: ""
      PLAYBACK_RESOLVE_TIMEOUT: 30s
      EMBY_DIRECT_PLAY_ONLY: "true"
      EMBY_PROXY_ENABLED: "false"
      EMBY_302_ENABLED: "false"
      EMBY_UPSTREAM_URL: ""
      EMBY_STRM_PATH_PREFIX: /strm
      EMBY_STRM_RESOLVER_ORIGINS: ""
      WORKER_POLL_INTERVAL: 2s
      WORKER_LEASE: 90s
    ports: ["127.0.0.1:8080:8080", "127.0.0.1:8091:8091"]
    # 可直接换为 /your/host/data:/data；不需要在后台绑定本地目录。
    volumes: [app-data:/data, downloads-data:/data/downloads:ro, /proc/loadavg:/host/proc/loadavg:ro, /proc/stat:/host/proc/stat:ro, /proc/meminfo:/host/proc/meminfo:ro, /proc/uptime:/host/proc/uptime:ro]
    user: "65532:65532"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, /app/media-tool, -role, healthcheck]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    logging: *logging
    restart: unless-stopped
  postgres:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_DB: media_tool
      POSTGRES_USER: media_tool
      POSTGRES_PASSWORD: CHANGE_ME_POSTGRES_PASSWORD
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    # 仅供本机CLI测试；服务器可直接删除ports。后台数据浏览使用内部连接。
    ports: ["127.0.0.1:15432:5432"]
    volumes: [postgres-data:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging
    restart: unless-stopped
  redis:
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    environment: {REDIS_PASSWORD: CHANGE_ME_REDIS_PASSWORD}
    command: [sh, -c, 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    ports: ["127.0.0.1:16379:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging
    restart: unless-stopped
volumes:
  app-data:
  downloads-data:
  postgres-data: {name: media-tool_postgres-data}
  redis-data: {name: media-tool_redis-data}
